plugins {
    id 'base'
}

tasks.named('build') {
    dependsOn gradle.includedBuild('ForceBlend-Fabric').task(':build')
    dependsOn gradle.includedBuild('ForceBlend-NeoForge').task(':build')
}

tasks.named('check') {
    dependsOn gradle.includedBuild('ForceBlend-Fabric').task(':check')
    dependsOn gradle.includedBuild('ForceBlend-NeoForge').task(':check')
}

tasks.named('clean') {
    dependsOn gradle.includedBuild('ForceBlend-Fabric').task(':clean')
    dependsOn gradle.includedBuild('ForceBlend-NeoForge').task(':clean')
}

['test', 'forceBlendWorldCopyTest', 'forceBlendWorldAudit'].each { taskName ->
    tasks.register(taskName) {
        group = 'verification'
        dependsOn gradle.includedBuild('ForceBlend-Fabric').task(":${taskName}")
    }
}
