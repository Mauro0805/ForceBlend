# ForceBlend server settings and permission to prepare world files.
# Copy this file beside your server JAR, fill in worlds and minecraft-version, then accept below.
# Stop the server and world editors first. Keep an independent, recoverable copy of important worlds.
# Run: java -Xmx128m -jar ForceBlend-bukkit-${version}.jar --settings forceblend-settings-and-acceptance.properties
# Start Minecraft only when this command exits with code 0. A nonzero exit must stop your startup script.
# This file configures the standalone pre-start route. The optional in-server adapter uses plugins/ForceBlend/config.yml.

# Set true only after reading these instructions. False refuses preparation, but read-only analysis is allowed.
# There is no dialog. Acceptance never permits writing to a world already locked by Minecraft.
accept-world-preparation=false

# Directory containing the world folders and backups/forceblend/. Relative paths start at this file's directory.
# Use forward slashes on Windows (E:/servers/example), or escape every backslash as \\.
# World targets must be existing, non-linked Overworlds beneath this container, with level.dat and session.lock.
world-container=.

# Exact version recorded in the world's level.dat, for example 1.18.2 or 1.21.11; do not use a loader/plugin version.
# Leave blank until configured. A mismatch, unsupported stable release, snapshot or preview is refused.
# Shared format profiles cover 1.18-1.21.11 and 26.1-26.3; that is NOT a tested Bukkit compatibility range.
# Check the release's advertised server versions before use. Format support alone does not establish compatibility.
minecraft-version=

# Comma-separated world directories, relative to world-container. Example: worlds=world,another-world
# Empty means no targets and will refuse preparation; no world is guessed or created.
# For names containing commas, leave worlds empty and use indexed entries instead:
# worlds.0=My world, with comma
# worlds.1=Another world
# Do not mix a nonempty worlds value with worlds.N entries. Nether/End/custom-dimension folders are not targets.
worlds=

# true: analyze, make a mandatory full backup, prepare existing border chunks, then record eligible completion.
# false: do not apply. If analysis-enabled is true, perform read-only analysis instead.
# Pre-start defaults true behind acceptance; the in-server adapter defaults false for lifecycle safety.
preparation-enabled=true

# true with preparation-enabled=false: report counts, regions, deferred chunks and estimated apply time only.
# No backup, blending tags or completion marker are written. Preparation wins when both flags are true.
# CLI --action analyze explicitly selects analysis; --action unchanged skips work.
analysis-enabled=false

# Master switch. false skips automatic work, including analysis, without changing the world.
automatic-processing=true

# Same preference as the mod, but dedicated servers ALWAYS require a completed full backup before writing.
# Setting false does not disable server backups. ZIPs are outside the world in backups/forceblend/<world>/.
# Only root session.lock is excluded. Retain backups; failures may need manual restoration to a separate copy.
automatic-backup=true

# once: skip worlds already completed by ForceBlend or the legacy ForceBlend Once marker.
# every-open: analyze again on every pre-start invocation, useful after imports, deletion or generator/seed changes.
# ForceBlend does not change the seed or generate terrain. Minecraft blends subsequently generated neighboring chunks.
run-mode=once

# unlimited or 0: no limit. A positive whole number limits modified chunks per invocation.
# Deferred runs never record completion. Invoke again to continue; remove the limit to finish in one run.
maximum-chunks-per-run=unlimited

# all, auto or 0: request all available processors. Otherwise use a whole number from 1 to 256.
# The worker caps concurrency by processors and heap budget: reserve 256 MiB, then allow one thread per 128 MiB.
# Default worker heap is 512 MiB, allowing up to two processing threads. Requests can therefore be reduced.
# To raise the heap explicitly, put -Dforceblend.workerHeapMiB=1024 BEFORE -jar in the pre-start command.
# Allowed heap: 256-4096 MiB. Reserve RAM for the server, OS and other programs; no setting guarantees no OOM.
# Whole-world planning also uses memory. Use fewer threads and test a copy first for large/custom worlds.
processing-threads=all

# false: phase/count/ETA, backup and completion logs. true: also log individual region/chunk events (can be noisy).
detailed-logging=false

# Processing settings match the dedicated-server mod; the separate worker also applies the memory cap above.
# CLI --world-container, repeatable --world, --minecraft-version and --<processing-setting> override this file.
# Per-region safeguards are not an atomic transaction across every world. Never bypass a failed startup check.
# To remove ForceBlend: stop the server, remove its JAR AND pre-start command/guard, then start normally.
# Settings are optional afterward. Keep backups and native blending tags; removal does not undo terrain changes.
# Deferred work and every-open automation stop after removal. Finish pending preparation first if needed.
