modLoader="javafml"
loaderVersion="[1,)"
license="MIT"
issueTrackerURL="https://github.com/Mauro0805/ForceBlend/issues"

[[mods]]
modId="forceblend"
version="${version}"
displayName="ForceBlend"
authors="Mauro0805, SasnycoN"
displayURL="https://github.com/Mauro0805/ForceBlend"
description='''
ForceBlend was written by Mauro0805. Maintained by Mauro0805 and SasnycoN.
Prepares existing Overworld chunks for Minecraft's native terrain blending, with
client confirmation and a headless dedicated-server path. Runs once per world by
default, with an every-opening option.
'''

[[mixins]]
config="forceblend.neoforge.mixins.json"

[[dependencies.forceblend]]
modId="neoforge"
type="required"
versionRange="[${neo_version},26.4)"
ordering="NONE"
side="BOTH"

[[dependencies.forceblend]]
modId="minecraft"
type="required"
versionRange="[26.3,26.4)"
ordering="NONE"
side="BOTH"
